[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-visualization-skill"
version = "0.1.0"
description = "Integrity-first Agent Skill and deterministic QA tools for publication-grade scientific figures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kursat Kilic"}]
dependencies = [
  "Pillow>=10",
  "jsonschema>=4.20",
  "pypdf>=5"
]

[project.optional-dependencies]
demo = ["matplotlib>=3.8", "numpy>=1.26"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
